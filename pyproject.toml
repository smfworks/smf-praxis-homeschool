[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-homeschool"
version = "0.2.0"
description = "SMF Praxis Homeschool vertical — parent-operated household education pack"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SMF Works", email = "hello@smfworks.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "praxis-agent>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "mypy"]

[project.entry-points."praxis.verticals"]
homeschool = "hybridagent_praxis_homeschool:register"

[tool.setuptools.packages.find]
include = ["hybridagent_praxis_homeschool*"]

[tool.setuptools.package-data]
"hybridagent_praxis_homeschool" = [
    "packs/*/pack.json",
    "packs/*/knowledge.md",
    "web/*.css",
    "web/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = true
